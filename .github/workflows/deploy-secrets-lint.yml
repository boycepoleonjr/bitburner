# Synced from boycepoleonjr/conventions v1.7.0.
# Action refs (uses: ...@<sha>) and node-version are repo-owned after the first sync; Dependabot keeps the refs current (SUP-7).
# Fails if a workflow reads a deploy secret (secrets.CLOUDFLARE_*) outside a branch-restricted GitHub Environment (STANDARD DEP-3).
name: Deploy secrets lint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Fetch pinned conventions
        run: |
          REF=$(node -p "'v' + require('./.conventions.lock.json').version")
          git clone --depth 1 --branch "$REF" https://github.com/boycepoleonjr/conventions /tmp/conventions
      - name: Lint workflow secrets
        run: node /tmp/conventions/scripts/lint-workflow-secrets.mjs --repo .
