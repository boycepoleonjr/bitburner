# Tests and parse checks on every PR and every push to main. Railway's "Wait for CI" holds the hosted deploy of a
# main commit until this passes, and the main ruleset requires the "test" check before merging.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Parse-check in-game scripts
        run: node .github/scripts/check-syntax.js
      - run: npm test
      # Production (Dockerfile) runs Node 26, so the same checks run there too. One job keeps the required check name "test".
      # test/ci-node-versions.js fails if the Dockerfile's Node major is not tested here.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - name: Parse-check in-game scripts (Node 26)
        run: node .github/scripts/check-syntax.js
      - name: Tests (Node 26)
        run: npm test
