# Claude code review on every PR (opened / new commits). Needs the Claude GitHub App installed on the repo and ONE of
# these repo secrets: CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token`; uses your Claude subscription) or
# ANTHROPIC_API_KEY. Without a secret (or on fork PRs, which get no secrets) the review step is skipped, not failed.
name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip (no Claude secret configured)
        if: env.HAS_CLAUDE_AUTH != 'true'
        run: echo "::notice::Set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY to enable Claude review."
      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the working directory.
            Context: this repo runs an unattended, 24/7 Bitburner game. Read AGENTS.md first; its "Owner's standing
            rules" are hard requirements. game/ mirrors the in-game home server (Netscript 2 JS run by the game),
            server/ is the Node bridge + hosted container logic, deploy/ + Dockerfile build the Railway image.

            Focus on, in order:
            1. Correctness bugs: wrong logic, unhandled errors, races, anything that could stall the game loop,
               waste in-game money or RAM, or crash the hosted server/watchdog.
            2. Violations of AGENTS.md standing rules (aug buy order, NeuroFlux last, never deleting saves or
               /data/state or backups, never changing game options).
            3. Security: tokens or webhooks leaking into logs, Discord, commits or responses; auth bypass on /api/*.
            4. Missing tests for server/ changes (tests live in test/, run with npm test).
            Skip style nits unless they hide a bug. If the PR is fine, say so in one short comment.

            Use `gh pr comment` for one top-level summary and
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for specific lines.
            Only post GitHub comments; don't reply with review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
