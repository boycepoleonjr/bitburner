# Synced from boycepoleonjr/conventions v1.7.0 (CI-4). Edit there. Repo-specific review focus goes in "claude_review.focus" in .conventions.json; opt out by adding "claude-review" to "skip".
# Action refs (uses: ...@<sha>) are repo-owned after the first sync and kept current by Dependabot (SUP-7).
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# No default token scopes; the job declares what it needs.
permissions: {}

# A newer push cancels the older run. The newer run reviews the full diff, so nothing is skipped.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip drafts, fork PRs (no secrets or OIDC) and bot authors as a skipped job, not a failure.
    # A skipped required check is not a pass everywhere: durable-agent treats a skipped required check as blocking.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(fromJSON('["dependabot[bot]", "github-actions[bot]", "renovate[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # A missing secret must fail the check loudly, never skip the review silently.
      - name: Require CLAUDE_CODE_OAUTH_TOKEN
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Add it under Settings > Secrets and variables > Actions (run 'claude setup-token'), or add claude-review to skip in .conventions.json."
            exit 1
          fi

      # persist-credentials: false so no checkout token stays in git config (local, include or includeIf.gitdir)
      # while Claude runs, on any checkout version. claude-code-action sets up git with its own token.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # cursor[bot] is the org's own agent and may trigger reviews like a maintainer.
          allowed_bots: "cursor"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Review this pull request. This workflow runs on every push, so always review the FULL diff of the PR on every run, not only the latest commit. Always complete the review; do not skip it.

            1. Read AGENTS.md (and CLAUDE.md if present) at the repo root, especially the "Review guidelines" section, and follow them.
            2. Run `gh pr view ${{ github.event.pull_request.number }}` and `gh pr diff ${{ github.event.pull_request.number }}` and review the full diff of this PR. If `gh pr diff` fails for any reason (for example HTTP 406 because the diff is over GitHub's 20,000-line limit), do not stop and do not review only what you can see. Fall back to the file list: run `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --paginate` (GET only) and review file by file, using each file's `patch`. Also run `gh pr view ${{ github.event.pull_request.number }} --json changedFiles` and compare it with the number of files you actually read.
            3. Before posting anything, read what has already been posted: run `gh pr view ${{ github.event.pull_request.number }} --comments` and `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`. Use GET requests only; never modify anything with `gh api`. Do not repeat a finding that is already posted and still applies. Do post findings on new or changed lines, and anything earlier runs missed.
            4. For each real new defect (correctness, security, regressions, missing tests for changed behavior), post an inline comment on the relevant line with the `mcp__github_inline_comment__create_inline_comment` tool. Skip style nitpicks and anything linters already catch.
            5. Decide whether the review is complete. It is complete only when you read every changed file in full. It is incomplete when any of these is true: a file has no `patch` in the file list (binary or too large; a pure rename with `changes` 0 and nothing to read is the one exception), any `gh` call failed and was not recovered (the one failed `gh pr diff` that you replaced with the file-list fallback does not count, but a failure of the fallback itself does), the number of files read differs from `changedFiles` (the API returns at most 3000 files), or you could not finish for any other reason. When it is incomplete, say which files or steps were not read in the summary. Never present an incomplete review as a clean one.
            6. Always finish by posting exactly one summary comment with `gh pr comment ${{ github.event.pull_request.number }} --body "..."`. Start it by saying whether this is the first review or a re-review (it is a re-review if an earlier Claude review summary exists on the PR) and name the head SHA reviewed. List the new findings. If there are none and the review is complete, the summary must say "No new issues found". The summary must also contain exactly one machine-readable line, on its own line starting at the first character, with no backticks, bold or quotes: `review-status: complete ${{ github.event.pull_request.head.sha }}` when the review is complete, otherwise `review-status: incomplete ${{ github.event.pull_request.head.sha }} <short reason>`. A later workflow step reads this line and fails the check unless it says complete for this head SHA. Never write the text `review-status:` anywhere else in the comment.

            Repo-specific focus:
            AGENTS.md "Owner's standing rules" are hard requirements. game/ mirrors the in-game home server (Netscript 2 JS run by the game), server/ is the Node bridge + hosted container, deploy/ + Dockerfile build the Railway image.
            Correctness bugs that could stall the game loop, waste in-game money or RAM, or crash the server/watchdog.
            Standing-rule violations: aug buy order, NeuroFlux last, never deleting saves, /data/state or backups, never changing game options.
            Tokens/webhooks leaking into logs, Discord, commits or responses; auth bypass on /api/*.
            Missing tests for server/ changes.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files:*),Read,Glob,Grep"

      # Fail the check unless the review says it read every changed file. A green check on a review
      # that did not happen is worse than a red one. GET only; same token scopes as the job.
      - name: Verify the review was complete
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! raw=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate); then
            echo "::error::Could not list the PR comments to verify the review. Re-run the job."
            exit 1
          fi
          # Newest bot comment that names the head SHA and carries a review-status line, so unrelated bot comments
          # (deploy previews, other reviewers) cannot hide the summary. Humans cannot satisfy the check by typing the line.
          if ! summary=$(printf '%s' "$raw" | jq -sr --arg sha "$HEAD_SHA" '[.[][]] | map(select(.user.type == "Bot" and (.body | contains($sha)) and (.body | test("(^|\n)review-status:")))) | sort_by(.created_at) | last | .body // empty'); then
            echo "::error::Could not parse the PR comments to verify the review."
            exit 1
          fi
          if [ -z "$summary" ]; then
            echo "::error::No Claude review summary with a review-status line names head commit $HEAD_SHA, so this PR was not reviewed. Re-run the job."
            exit 1
          fi
          mapfile -t lines < <(printf '%s\n' "$summary" | tr -d '\r' | grep -E '^review-status:' || true)
          if [ "${#lines[@]}" -ne 1 ]; then
            echo "::error::The review summary for $HEAD_SHA must contain exactly one review-status line, found ${#lines[@]}. Treat this PR as not fully reviewed."
            exit 1
          fi
          if [ "${lines[0]}" != "review-status: complete $HEAD_SHA" ]; then
            echo "::error::The review of $HEAD_SHA is not complete: ${lines[0]:0:300}"
            exit 1
          fi
          echo "Review complete for $HEAD_SHA."
