name: Task / improvement
description: Something to build or change in the automation
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be different when this is done, and why it helps progress (money → augs → installs → BitNodes).
    validations: { required: true }
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Approach, constraints, links. Mention @claude to have Claude pick it up.
